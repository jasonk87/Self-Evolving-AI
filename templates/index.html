<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="main-container">
        <aside class="icon-sidebar">
            <!-- Icons will be added here -->
        </aside>
        <aside class="chat-history-sidebar">
            <div class="new-chat-button">
                <button>+ New Chat</button>
            </div>
            <div class="chat-history-list">
                <!-- Chat history items will be added here -->
            </div>
        </aside>
        <main class="chat-container">
            <div class="chat-log-area" id="chatLogArea">
                <div class="welcome-message">
                    <h1>A.I. ASSISTANT // WEIBO</h1>
                    <div class="suggestion-chips">
                        <!-- Suggestion chips will be added here -->
                    </div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Transmit directive..." autofocus>
                <button id="sendButton">Send</button>
            </div>
        </main>
    </div>

    <div id="projectDisplayArea" class="project-display-area" style="display:none;">
        <div class="project-display-header">Project Output</div>
        <div class="loading-indicator-container" style="display: none;">
            <div class="spinner"></div>
            <p>Loading Project...</p>
        </div>
        <iframe id="projectDisplayIframe" srcdoc="<p style='padding: 10px; color: #ccc;'>Interactive Project Area - Your web projects will appear here.</p>" sandbox="allow-scripts allow-same-origin" style="width:100%; height:100%; border:none;"></iframe>
        <div class="project-controls">
            <button id="pauseBtn" title="Pause Project Content">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18px" height="18px">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
            <button id="resumeBtn" title="Resume Project Content" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18px" height="18px">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            <button id="analyzeDisplayBtn" title="Analyze Displayed Content">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18px" height="18px">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v2h-2zm0 4h2v6h-2z"/>
                </svg>
            </button>
            <button id="reloadBtn" title="Reload Project Content">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18px" height="18px">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>
            <button id="fullscreenToggleBtn" title="Toggle Fullscreen">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18px" height="18px" class="icon-fullscreen-enter">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18px" height="18px" class="icon-fullscreen-exit" style="display:none;">
                    <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                </svg>
            </button>
            <button id="toggleProjectDisplayBtn" title="Toggle Project Display Area">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18px" height="18px">
                    <path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 7h2v2H5zm4 0h2v2H9zm4 0h2v2h-2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>
