<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="main-container">
        <button id="controlPanelToggle" class="control-panel-toggle">☰</button>
        <button id="toggleProjectDisplayBtn" title="Toggle Project Display Area">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px">
                <path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 7h2v2H5zm4 0h2v2H9zm4 0h2v2h-2z"/>
            </svg>
        </button>
        <aside class="control-panel">
            <div class="new-chat-button">
                <button>+ New Chat</button>
            </div>
            <div class="chat-history-list">
                <!-- Chat history items will be added here -->
            </div>
            <div class="control-panel-section">
                <h4>Reflections</h4>
                <div id="reflectionsContainer"></div>
            </div>
            <div class="control-panel-section">
                <h4>Suggestions</h4>
                <div id="suggestionsContainer"></div>
            </div>
        </aside>
        <main class="chat-container">
            <div class="chat-log-area" id="chatLogArea">
                <div class="welcome-message">
                    <h1>A.I. ASSISTANT // WEIBO</h1>
                    <div class="suggestion-chips">
                        <!-- Suggestion chips will be added here -->
                    </div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Transmit directive..." autofocus>
                <button id="sendButton">Send</button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>
