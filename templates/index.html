<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Cockpit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Using Google Fonts for a futuristic look -->
    <link
        href="https://fonts.googleapis.com/css2?family=Segoe+UI&family=Roboto:wght@300;400;500&family=Consolas&display=swap"
        rel="stylesheet">
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
</head>

<body>
    <div class="app-layout">
        <!-- 1. LEFT: Activity Bar (Icons) -->
        <aside class="activity-bar glass-panel">
            <div class="activity-top">
                <div class="activity-item active" title="Chat" data-target="view-chat" data-label="Chat">
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </span>
                </div>
                <!-- Tools that open the Sidebar Panel -->
                <div class="activity-item" title="Project Files" data-target="view-sidebar-files" data-label="Files">
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    </span>
                </div>
                <div class="activity-item" title="Terminal" data-target="view-sidebar-terminal" data-label="Terminal">
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                    </span>
                </div>
                <div class="activity-item" title="Council" data-target="view-sidebar-council" data-label="The Council">
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
                <div class="activity-item" title="Memory" data-target="view-sidebar-memory" data-label="Memory">
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2z"></path><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>
                    </span>
                </div>
                <div class="activity-item" title="Settings" data-target="view-sidebar-settings" data-label="Settings">
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </span>
                </div>
            </div>

            <div class="activity-bottom">
                <div class="activity-item" title="Code Editor" data-target="view-editor-main" data-label="Editor">
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    </span>
                </div>
            </div>
        </aside>

        <!-- 2. LEFT: Sidebar Panel (Context Content) -->
        <!-- This panel is visible when a "sidebar tool" is active. -->
        <aside class="sidebar-panel glass-panel" id="sidebar-panel">

            <!-- Files View -->
            <div id="view-sidebar-files" class="sidebar-view hidden">
                <div class="panel-header">
                    <h3>EXPLORER</h3>
                    <button class="btn-icon" onclick="loadProjects()" title="Refresh">↻</button>
                </div>
                <div id="file-tree" class="file-tree-container">
                    <!-- Populated by JS -->
                    <div class="loading">Loading projects...</div>
                </div>
            </div>

            <!-- Terminal View -->
            <div id="view-sidebar-terminal" class="sidebar-view hidden">
                <div class="panel-header">
                    <h3>TERMINAL</h3>
                    <button class="btn-icon" id="clear-terminal">🚫</button>
                </div>
                <div id="terminal-output" class="terminal-output">
                    <div class="line system">Terminal Online...</div>
                </div>
                <div class="terminal-input-wrapper">
                    <span class="prompt">$</span>
                    <input type="text" id="terminal-input" placeholder="Command...">
                </div>
            </div>

            <!-- Council View (Logs) -->
            <div id="view-sidebar-council" class="sidebar-view hidden">
                <div class="panel-header">
                    <h3>THE COUNCIL</h3>
                </div>
                <div id="council-logs" class="council-container">
                    <div class="log-entry system">Listening to Agent Swarm...</div>
                </div>
            </div>

            <!-- Memory View (Facts) -->
            <div id="view-sidebar-memory" class="sidebar-view hidden">
                <div class="panel-header">
                    <h3>LONG-TERM MEMORY</h3>
                    <button class="btn-icon" id="add-fact-btn" title="Add Fact">➕</button>
                </div>
                <div class="memory-wrapper">
                    <div id="memory-list" class="memory-list">
                        <!-- Facts go here -->
                        <div class="loading">Fetching engrams...</div>
                    </div>
                </div>
            </div>

            <!-- Settings View -->
            <div id="view-sidebar-settings" class="sidebar-view hidden">
                <div class="panel-header">
                    <h3>SETTINGS</h3>
                </div>
                <div class="settings-form">
                    <div class="form-group">
                        <label>LLM Provider</label>
                        <select id="setting-llm">
                            <option value="ollama">Ollama (Local)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Notifications</label>
                        <button id="test-notify-btn" class="btn-primary">Test Notification</button>
                    </div>
                </div>
            </div>

        </aside>

        <!-- 3. MAIN STAGE (Right) -->
        <main class="main-stage">

            <!-- Chat Interface (Default) -->
            <div id="view-chat" class="view-container active">
                <header class="stage-header glass-panel">
                    <span class="title">AI ASSISTANT</span>
                </header>
                <div id="chat-container">
                    <div class="message system">
                        <div class="bubble">Systems Nominal. Ready.</div>
                    </div>
                </div>
                <div class="input-area glass-panel">
                    <textarea id="chat-input" placeholder="Instructions..." rows="1"></textarea>
                    <button id="send-btn">SEND</button>
                </div>
            </div>

            <!-- Editor Interface -->
            <div id="view-editor-main" class="view-container">
                <header class="stage-header glass-panel">
                    <span class="title" id="current-file-name">No File Open</span>
                    <div class="actions">
                        <button id="save-file-btn" class="btn-icon">💾</button>
                        <button id="run-file-btn" class="btn-icon">▶️</button>
                        <button id="close-file-btn" class="btn-icon">❌</button>
                    </div>
                </header>
                <div id="editor-container"></div>
            </div>

        </main>
    </div>

    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <!-- CodeMirror -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <!-- Main JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
