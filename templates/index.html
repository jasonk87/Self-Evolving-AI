<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Cockpit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Using Google Fonts for a futuristic look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cockpit-container">
        <!-- Left Sidebar: Navigation -->
        <nav class="sidebar glass-panel">
            <div class="logo">
                <div class="logo-icon">AI</div>
            </div>
            <ul class="nav-links">
                <li class="active" title="Chat"><span class="icon">💬</span></li>
                <li title="Projects"><span class="icon">📁</span></li>
                <li title="Tools"><span class="icon">🛠️</span></li>
                <li title="Settings"><span class="icon">⚙️</span></li>
                <li title="Profile"><span class="icon">👤</span></li>
            </ul>
        </nav>

        <!-- Center Panel: Chat Interface -->
        <main class="chat-interface glass-panel" id="chat-panel">
            <header class="chat-header">
                <h1>Command Center</h1>
                <div class="status-indicator online">Online</div>
            </header>

            <div class="chat-history" id="chat-history">
                <div class="message system-message">
                    <div class="bubble">System initialized. Welcome to the AI Cockpit.</div>
                </div>
                <!-- Messages will be appended here -->
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper glass-input">
                    <textarea id="user-input" placeholder="Enter command or message..." rows="1"></textarea>
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </main>

        <!-- Center Panel: Code Editor (Initially Hidden) -->
        <main class="editor-interface glass-panel hidden" id="editor-panel">
            <header class="editor-header">
                <h1 id="editor-filename">filename.py</h1>
                <div class="editor-actions">
                    <button id="close-editor-btn" class="secondary-btn">Close</button>
                    <button id="save-file-btn" class="primary-btn">Save</button>
                </div>
            </header>
            <div class="editor-container">
                <textarea id="file-editor" spellcheck="false"></textarea>
            </div>
        </main>

        <!-- Right Panel: Context Panel (Collapsible) -->
        <aside class="context-panel glass-panel" id="context-panel">
            <div class="panel-header">
                <h2>Context</h2>
                <button id="toggle-context" class="toggle-btn">›</button>
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-tab="files">Files</button>
                <button class="tab-btn" data-tab="terminal">Terminal</button>
                <button class="tab-btn" data-tab="memory">Memory</button>
            </div>
            <div class="tab-content" id="tab-files">
                <div id="file-tree" class="file-tree">
                    <!-- File tree will be rendered here -->
                    <div class="loading">Loading projects...</div>
                </div>
            </div>
            <div class="tab-content hidden" id="tab-terminal">
                <div class="terminal-view">
                    <div class="line">User@System:~$ ready</div>
                </div>
            </div>
            <div class="tab-content hidden" id="tab-memory">
                <div class="empty-state">Memory access ready</div>
            </div>
        </aside>
    </div>

    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
    <!-- Main Application Logic -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
