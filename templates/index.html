<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Cockpit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Using Google Fonts for a futuristic look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cockpit-container">
        <!-- Left Sidebar: Navigation -->
        <nav class="sidebar glass-panel">
            <div class="logo">
                <div class="logo-icon">AI</div>
            </div>
            <ul class="nav-links">
                <li class="active" title="Chat"><span class="icon">💬</span></li>
                <li title="Projects"><span class="icon">📁</span></li>
                <li title="Tools"><span class="icon">🛠️</span></li>
                <li title="Settings"><span class="icon">⚙️</span></li>
                <li title="Profile"><span class="icon">👤</span></li>
            </ul>
        </nav>

        <!-- Center Panel: Chat Interface -->
        <main class="chat-interface glass-panel">
            <header class="chat-header">
                <h1>Command Center</h1>
                <div class="status-indicator online">Online</div>
            </header>

            <div class="chat-history" id="chat-history">
                <div class="message system-message">
                    <div class="bubble">System initialized. Welcome to the AI Cockpit.</div>
                </div>
                <!-- Messages will be appended here -->
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper glass-input">
                    <textarea id="user-input" placeholder="Enter command or message..." rows="1"></textarea>
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </main>

        <!-- Right Panel: Context Panel (Collapsible) -->
        <aside class="context-panel glass-panel" id="context-panel">
            <div class="panel-header">
                <h2>Context</h2>
                <button id="toggle-context" class="toggle-btn">›</button>
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-tab="files">Files</button>
                <button class="tab-btn" data-tab="terminal">Terminal</button>
                <button class="tab-btn" data-tab="memory">Memory</button>
            </div>
            <div class="tab-content" id="tab-files">
                <div class="empty-state">No active files</div>
            </div>
            <div class="tab-content hidden" id="tab-terminal">
                <div class="terminal-view">
                    <div class="line">User@System:~$ ready</div>
                </div>
            </div>
            <div class="tab-content hidden" id="tab-memory">
                <div class="empty-state">Memory access ready</div>
            </div>
        </aside>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatHistory = document.getElementById('chat-history');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const contextPanel = document.getElementById('context-panel');
            const toggleContext = document.getElementById('toggle-context');

            // Auto-resize textarea
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // Handle Enter key
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            sendBtn.addEventListener('click', sendMessage);

            async function sendMessage() {
                const message = userInput.value.trim();
                if (!message) return;

                // Add user message
                appendMessage('user', message);
                userInput.value = '';
                userInput.style.height = 'auto';

                // Show typing indicator?
                // For now, just wait for response
                const loadingId = appendSystemMessage('Thinking...');

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: message })
                    });

                    const data = await response.json();

                    // Remove loading message
                    const loadingMsg = document.getElementById(loadingId);
                    if (loadingMsg) loadingMsg.remove();

                    if (data.success) {
                        appendMessage('ai', data.response);
                    } else {
                        appendMessage('error', data.error || data.response || "An error occurred.");
                    }

                } catch (error) {
                    console.error('Error:', error);
                    const loadingMsg = document.getElementById(loadingId);
                    if (loadingMsg) loadingMsg.remove();
                    appendMessage('error', 'Network error or server unavailable.');
                }
            }

            function appendMessage(sender, text) {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message', `${sender}-message`);

                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                // Simple formatting for newlines
                bubble.innerText = text;

                msgDiv.appendChild(bubble);
                chatHistory.appendChild(msgDiv);
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }

            function appendSystemMessage(text) {
                const id = 'sys-' + Date.now();
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message', 'system-message');
                msgDiv.id = id;

                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                bubble.innerText = text;

                msgDiv.appendChild(bubble);
                chatHistory.appendChild(msgDiv);
                chatHistory.scrollTop = chatHistory.scrollHeight;
                return id;
            }

            // Context Panel Toggle
            toggleContext.addEventListener('click', () => {
                contextPanel.classList.toggle('collapsed');
                toggleContext.innerText = contextPanel.classList.contains('collapsed') ? '‹' : '›';
            });

            // Tabs
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    const tabName = tab.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                    document.getElementById(`tab-${tabName}`).classList.remove('hidden');
                });
            });
        });
    </script>
</body>
</html>
