name: Test Lanes

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  weebo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Weebo 2.0 boot self-test
        run: python -m weebo --selftest
      - name: Weebo 2.0 web UI syntax
        # Same check as the self-evolution gate: plain `node --check x.js` can pass a broken ES module.
        run: |
          python - <<'EOF'
          import asyncio, pathlib, shutil, sys
          from weebo.evolution.gates import check_js

          async def main():
              node = shutil.which("node")
              files = sorted(pathlib.Path("weebo/web/js").glob("*.js"))
              errors = [error for f in files if (error := await check_js(node, f))]
              print("\n\n".join(errors) or f"All {len(files)} UI modules parse.")
              return 1 if errors else 0

          sys.exit(asyncio.run(main()))
          EOF
      - name: Browser for UI tests
        run: python -m playwright install --with-deps chromium
      - name: Weebo 2.0 tests
        run: |
          git config --global user.name "ci" && git config --global user.email "ci@example.com"
          python -m pytest tests/weebo -q -p no:cacheprovider

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit lane
        run: bash scripts/run_test_lanes.sh unit

  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integration lane
        run: bash scripts/run_test_lanes.sh integration

  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run smoke lane
        run: bash scripts/run_test_lanes.sh smoke
