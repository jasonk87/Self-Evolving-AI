[pytest]
python_files = test_*.py
testpaths = tests
norecursedirs =
    tests/test_ai_assistant_ws_self_modification
    tests/manual
markers =
    smoke: smoke-level integration checks
    integration: environment-dependent integration checks (optional deps/services)
    llm: tests that require an LLM/API backend
    asyncio: async test marker
addopts = -ra
